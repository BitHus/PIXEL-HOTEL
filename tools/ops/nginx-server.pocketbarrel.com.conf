# /etc/nginx/sites-available/server.pocketbarrel.com (link into sites-enabled)
# The two limit_req_zone lines and the map belong in the http {} block (put them in /etc/nginx/conf.d/pb-limits.conf).
limit_req_zone $binary_remote_addr zone=pb_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pb_auth:10m rate=1r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name server.pocketbarrel.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name server.pocketbarrel.com;

    # Filled in by: certbot --nginx -d server.pocketbarrel.com
    ssl_certificate     /etc/letsencrypt/live/server.pocketbarrel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.pocketbarrel.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;   # saves are at most PB_SAVE_MAX_BYTES (1 MB)
    server_tokens off;

    location ~ ^/api/(login|register)$ {
        limit_req zone=pb_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append a client value (PB_TRUST_PROXY=1)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=pb_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Websocket (P2, later): same upstream with the upgrade headers.
    location /ws {
        limit_req zone=pb_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
